# Local chains for `make demo` (W3). NEAR stays on public testnet (real MPC); only the target
# chains are local so the demo needs no faucets and no owner funds.
#
#   anvil                 evm:31337   http://127.0.0.1:${GHOST_ANVIL_PORT:-8545}
#   solana-test-validator sol:local   http://127.0.0.1:${GHOST_SOLANA_PORT:-8899} (ws +1)
#
# Spike S4 findings (2026-11-09, agave 3.1.15):
#  - Docker's default seccomp profile blocks io_uring, and agave 3.x asserts io_uring support
#    when creating its accounts dirs → exit 101. `seccomp:unconfined` is required.
#  - `--bind-address 0.0.0.0` panics in gossip; binding the container's own IP works and keeps
#    RPC reachable through the port mapping.
#  - Healthy ~1 s after start; requestAirdrop works.
name: ghost-paths-demo

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--silent"]
    ports:
      - "127.0.0.1:${GHOST_ANVIL_PORT:-8545}:8545"
    restart: "no"

  solana:
    image: anzaxyz/agave:stable
    security_opt:
      - seccomp:unconfined
    entrypoint: ["sh", "-c"]
    command:
      - exec solana-test-validator --ledger /tmp/ledger --reset --quiet --bind-address "$$(hostname -i | cut -d' ' -f1)"
    ports:
      - "127.0.0.1:${GHOST_SOLANA_PORT:-8899}:8899"
      - "127.0.0.1:${GHOST_SOLANA_WS_PORT:-8900}:8900"
    restart: "no"
