[package]
name = "ghost-paths"
description = "Ghost Paths: stealth-address registry, announcement log and Chain Signatures sweep gateway on NEAR"
version = "0.1.0"
edition = "2024"
license = "MIT"
# NEP-0330: exposed via the contract_source_metadata view function.
repository = "https://github.com/AaroneGeorge/near-ghost-paths"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
# Image/digest copied from the sibling project (tripwire); re-check with
# `docker pull sourcescan/cargo-near:0.22.0-rust-1.99.1` before the mainnet build.
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
# `unstable` exposes env::ecrecover.
near-sdk = { version = "5.30.1", features = ["unstable"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unstable", "unit-testing"] }
near-workspaces = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
serde_json = "1"
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
sha2 = "0.10"
sha3 = "0.10"
ed25519-dalek = "2"
bs58 = "0.5"
rand = "0.8"

[workspace]
members = [".", "tests/mock_signer"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
